[bar.default]
layer = "overlay"
position = "bottom"
reserve_space = false
smart_auto_hide = true

[config]

[dock]
background_opacity = 0.80999998189508915
reserve_space = false

[lockscreen]
transition = [ "fade" ]
transition_duration = 500

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 240.0
    cx = 800.0
    cy = 706.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 0.0
        center_password_text = true
        input_opacity = 0.56000000000000005
        input_radius = 32.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = true
        show_password_reveal = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 800.0
    cy = 374.5
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"

[shell]
font_family = "Noto Sans"
polkit_agent = true
settings_show_advanced = false
settings_window_translucent = true

    [shell.panel]
    transparency_mode = "glass"

[templates]

[theme]
builtin = "Gruvbox"
community_palette = "Gruvbox Material"
pure_black_dark = true
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/luke/nixos-config/home/hypr/wallpaper"
transition = [ "fade" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/luke/nixos-config/home/hypr/wallpaper/forest.jpg"

    [wallpaper.last]
    path = "/home/luke/nixos-config/home/hypr/wallpaper/forest.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/luke/nixos-config/home/hypr/wallpaper/forest.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/luke/nixos-config/home/hypr/wallpaper/forest.jpg"
